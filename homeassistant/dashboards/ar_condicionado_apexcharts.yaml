# Dashboard "Ar Condicionado" - variante com gráfico apexcharts-card
#
# Igual a ar_condicionado.yaml, mas o gráfico mostra também os setpoints a tracejado.
# Requer o cartão custom "apexcharts-card" (HACS > Frontend > apexcharts-card); sem ele o
# primeiro cartão mostra "Erro de configuração".
#
# Como usar: Definições > Painéis > Adicionar painel > (abrir) > ✏️ Editar >
# ⋮ > Editor de configuração em bruto > colar este ficheiro.
title: Ar Condicionado
views:
  - title: Ar Condicionado
    path: ar-condicionado
    icon: mdi:snowflake
    cards:
      # ------------------------------------------------------------------ gráfico
      - type: custom:apexcharts-card
        header:
          show: true
          title: Temperaturas
          show_states: false
        graph_span: 1d
        update_interval: 5min
        chart_type: line
        apex_config:
          legend:
            position: top
            horizontalAlign: right
          xaxis:
            labels:
              datetimeUTC: false
        yaxis:
          - min: 10
            max: 35
            decimals: 0
        series:
          - entity: sensor.ac_living_room_temperatura
            name: Sala de estar
            color: "#3b82f6"
            stroke_width: 2
          - entity: sensor.ac_cozinha_temperatura
            name: Cozinha
            color: "#10b981"
            stroke_width: 2
          - entity: sensor.ac_office_temperatura
            name: Office
            color: "#a855f7"
            stroke_width: 2
          - entity: sensor.ac_suite_master_temperatura
            name: Suite Master
            color: "#ec4899"
            stroke_width: 2
          - entity: sensor.ac_kids_room_temperatura
            name: Quarto Crianças
            color: "#eab308"
            stroke_width: 2
          - entity: sensor.temperatura_exterior
            name: Exterior
            color: "#f97316"
            stroke_width: 3
          # Setpoints a tracejado, na cor da unidade, fora da legenda
          - entity: sensor.ac_living_room_setpoint
            name: Setpoint Sala de estar
            color: "#3b82f6"
            stroke_width: 1
            stroke_dash: 4
            show: {in_legend: false}
          - entity: sensor.ac_cozinha_setpoint
            name: Setpoint Cozinha
            color: "#10b981"
            stroke_width: 1
            stroke_dash: 4
            show: {in_legend: false}
          - entity: sensor.ac_office_setpoint
            name: Setpoint Office
            color: "#a855f7"
            stroke_width: 1
            stroke_dash: 4
            show: {in_legend: false}
          - entity: sensor.ac_suite_master_setpoint
            name: Setpoint Suite Master
            color: "#ec4899"
            stroke_width: 1
            stroke_dash: 4
            show: {in_legend: false}
          - entity: sensor.ac_kids_room_setpoint
            name: Setpoint Quarto Crianças
            color: "#eab308"
            stroke_width: 1
            stroke_dash: 4
            show: {in_legend: false}

      # ----------------------------------------------- cartões por unidade (controlo)
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: climate.1ec942ca
            name: Sala de estar
            features: &features
              - type: target-temperature
              - type: climate-hvac-modes
                hvac_modes: ["off", cool, heat, auto, dry, fan_only]
              - type: climate-fan-modes
          - type: tile
            entity: climate.c62db069
            name: Cozinha
            features: *features
          - type: tile
            entity: climate.c63fd170
            name: Office
            features: *features
          - type: tile
            entity: climate.c640155f
            name: Suite Master
            features: *features
          - type: tile
            entity: climate.c64015c4
            name: Quarto Crianças
            features: *features

      # ------------------------------------------------------------------ resumo
      - type: entities
        title: Resumo
        state_color: true
        entities:
          - type: section
            label: Estado e modo
          - entity: sensor.ac_living_room_modo
            name: Sala de estar
          - entity: sensor.ac_cozinha_modo
            name: Cozinha
          - entity: sensor.ac_office_modo
            name: Office
          - entity: sensor.ac_suite_master_modo
            name: Suite Master
          - entity: sensor.ac_kids_room_modo
            name: Quarto Crianças
          - type: section
            label: Ventilador
          - entity: sensor.ac_living_room_ventilador
            name: Sala de estar
          - entity: sensor.ac_cozinha_ventilador
            name: Cozinha
          - entity: sensor.ac_office_ventilador
            name: Office
          - entity: sensor.ac_suite_master_ventilador
            name: Suite Master
          - entity: sensor.ac_kids_room_ventilador
            name: Quarto Crianças
          - type: section
            label: Exterior
          - entity: sensor.temperatura_exterior
            name: Temperatura Exterior
          - type: attribute
            entity: weather.forecast_casa
            attribute: humidity
            name: Humidade Exterior
            suffix: " %"

      # -------------------------------------------------------- temperaturas atuais
      - type: glance
        title: Temperaturas atuais
        show_state: true
        entities:
          - entity: sensor.ac_living_room_temperatura
            name: Sala
          - entity: sensor.ac_cozinha_temperatura
            name: Cozinha
          - entity: sensor.ac_office_temperatura
            name: Office
          - entity: sensor.ac_suite_master_temperatura
            name: Suite
          - entity: sensor.ac_kids_room_temperatura
            name: Crianças
          - entity: sensor.temperatura_exterior
            name: Exterior
