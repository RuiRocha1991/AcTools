# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Acrescenta ao CSV uma linha por unidade:
#   data,unidade,temperatura,setpoint,modo,ligado,ventilador
# (cabeçalho criado se o ficheiro não existir).
#   temperatura = temperatura ambiente lida pelo AC (current_temperature)
#   setpoint    = temperatura pedida (atributo temperature)
#   modo        = estado do climate (off, cool, heat, auto, dry, fan_only, unavailable)
#   ligado      = 1 se o modo != off, 0 se off, vazio se indisponível
#   ventilador  = fan_mode (auto, low, medium low, medium, medium high, high)
# Campos indisponíveis ficam em branco.
# Linha extra unidade=exterior: temperatura da entidade weather.forecast_casa (só a coluna temperatura).
shell_command:
  append_temperaturas_csv: |-
    sh -c '
    f=/config/temperaturas.csv
    [ -f "$f" ] || echo "data,unidade,temperatura,setpoint,modo,ligado,ventilador" > "$f"
    {% set ts = now().strftime("%Y-%m-%dT%H:%M%z") %}
    {% set acs = {
      "living_room": "climate.1ec942ca",
      "cozinha": "climate.c62db069",
      "office": "climate.c63fd170",
      "suite_master": "climate.c640155f",
      "kids_room": "climate.c64015c4"
    } %}
    {% for nome, e in acs.items() %}
    {% set modo = states(e) %}
    {% set t = state_attr(e, "current_temperature") %}
    {% set sp = state_attr(e, "temperature") %}
    {% set fan = state_attr(e, "fan_mode") %}
    echo "{{ ts }},{{ nome }},{{ t if is_number(t) else "" }},{{ sp if is_number(sp) else "" }},{{ modo }},{{ "" if modo in ["unavailable", "unknown"] else (0 if modo == "off" else 1) }},{{ fan if fan else "" }}" >> "$f"
    {% endfor %}
    {% set ext = state_attr("weather.forecast_casa", "temperature") %}
    echo "{{ ts }},exterior,{{ ext if is_number(ext) else "" }},,,," >> "$f"
    '

  # CSV horário da tomada do office: uma linha por hora, escrita aos XX:00:30 para a hora que ACABOU.
  #   hora_inicio       = início da hora fechada (ex.: 14:00 para o consumo das 14:00 às 15:00)
  #   energia_hora_kwh  = energia consumida nessa hora (last_period do utility_meter)
  #   potencia_w, tensao_v, corrente_a, energia_total_kwh, tomada, ac_modo, ac_temperatura_c, exterior_c
  #                     = valores instantâneos no momento da escrita (fim da hora)
  # Campos indisponíveis ficam em branco.
  append_office_consumos_csv: |-
    sh -c '
    f=/config/office_consumos.csv
    [ -f "$f" ] || echo "hora_inicio,energia_hora_kwh,potencia_w,tensao_v,corrente_a,energia_total_kwh,tomada,ac_modo,ac_temperatura_c,exterior_c" > "$f"
    {% set ini = (now() - timedelta(hours=1)).strftime("%Y-%m-%dT%H:00%z") %}
    {% set eh = state_attr("sensor.office_energia_hora", "last_period") %}
    {% set p = states("sensor.office_ups_potencia") %}
    {% set v = states("sensor.office_ups_tensao") %}
    {% set c = states("sensor.office_ups_corrente") %}
    {% set et = states("sensor.office_ups_energia_total") %}
    {% set ta = state_attr("climate.c63fd170", "current_temperature") %}
    {% set ext = state_attr("weather.forecast_casa", "temperature") %}
    echo "{{ ini }},{{ eh | round(3) if is_number(eh) else "" }},{{ p if is_number(p) else "" }},{{ v if is_number(v) else "" }},{{ c if is_number(c) else "" }},{{ et if is_number(et) else "" }},{{ states("switch.office_ups_tomada_1") }},{{ states("climate.c63fd170") }},{{ ta if is_number(ta) else "" }},{{ ext if is_number(ext) else "" }}" >> "$f"
    '

template:
  - trigger:
      - platform: time_pattern
        minutes: "/15"
      # também ao arrancar o HA (evita "unknown" depois de reiniciar)
      - platform: homeassistant
        event: start
      # disparo manual: Ferramentas de programador > Eventos > ac_amostra
      - platform: event
        event_type: ac_amostra
    action:
      - service: homeassistant.update_entity
        continue_on_error: true # se um AC falhar, os sensores atualizam na mesma
        target:
          entity_id:
            - climate.1ec942ca
            - climate.c62db069
            - climate.c63fd170
            - climate.c640155f
            - climate.c64015c4
    sensor:
      - name: "AC Living Room Temperatura"
        unique_id: ac_living_room_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.1ec942ca', 'current_temperature') }}"
        availability: "{{ state_attr('climate.1ec942ca', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
