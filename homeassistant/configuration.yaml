recorder:
  purge_keep_days: 800
  commit_interval: 60
  include:
    entities:
      - sensor.ac_living_room_temperatura
      - sensor.ac_living_room_modo
      - sensor.ac_cozinha_temperatura
      - sensor.ac_cozinha_modo
      - sensor.ac_office_temperatura
      - sensor.ac_office_modo
      - sensor.ac_suite_master_temperatura
      - sensor.ac_suite_master_modo
      - sensor.ac_kids_room_temperatura
      - sensor.ac_kids_room_modo
