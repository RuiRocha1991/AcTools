# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Acrescenta ao CSV uma linha por unidade: data,unidade,temperatura,modo,ligado
# (cabeçalho criado se o ficheiro não existir).
#   modo   = estado do climate (off, cool, heat, auto, dry, fan_only, unavailable)
#   ligado = 1 se o modo != off, 0 se off, vazio se indisponível
shell_command:
  append_temperaturas_csv: |-
    sh -c '
    f=/config/temperaturas.csv
    [ -f "$f" ] || echo "data,unidade,temperatura,modo,ligado" > "$f"
    {% set ts = now().strftime("%Y-%m-%dT%H:%M%z") %}
    {% set acs = {
      "living_room": "climate.1ec942ca",
      "cozinha": "climate.c62db069",
      "office": "climate.c63fd170",
      "suite_master": "climate.c640155f",
      "kids_room": "climate.c64015c4"
    } %}
    {% for nome, e in acs.items() %}
    {% set modo = states(e) %}
    {% set t = state_attr(e, "current_temperature") %}
    echo "{{ ts }},{{ nome }},{{ t if is_number(t) else "" }},{{ modo }},{{ "" if modo in ["unavailable", "unknown"] else (0 if modo == "off" else 1) }}" >> "$f"
    {% endfor %}
    '

template:
  - trigger:
      - platform: time_pattern
        minutes: "/15"
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - climate.1ec942ca
            - climate.c62db069
            - climate.c63fd170
            - climate.c640155f
            - climate.c64015c4
    sensor:
      - name: "AC Living Room Temperatura"
        unique_id: ac_living_room_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.1ec942ca', 'current_temperature') }}"
        availability: "{{ state_attr('climate.1ec942ca', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Living Room Modo"
        unique_id: ac_living_room_modo
        icon: mdi:air-conditioner
        state: "{{ states('climate.1ec942ca') }}"
        availability: "{{ states('climate.1ec942ca') not in ['unavailable', 'unknown'] }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Cozinha Temperatura"
        unique_id: ac_cozinha_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.c62db069', 'current_temperature') }}"
        availability: "{{ state_attr('climate.c62db069', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Cozinha Modo"
        unique_id: ac_cozinha_modo
        icon: mdi:air-conditioner
        state: "{{ states('climate.c62db069') }}"
        availability: "{{ states('climate.c62db069') not in ['unavailable', 'unknown'] }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Office Temperatura"
        unique_id: ac_office_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.c63fd170', 'current_temperature') }}"
        availability: "{{ state_attr('climate.c63fd170', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Office Modo"
        unique_id: ac_office_modo
        icon: mdi:air-conditioner
        state: "{{ states('climate.c63fd170') }}"
        availability: "{{ states('climate.c63fd170') not in ['unavailable', 'unknown'] }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Suite Master Temperatura"
        unique_id: ac_suite_master_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.c640155f', 'current_temperature') }}"
        availability: "{{ state_attr('climate.c640155f', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Suite Master Modo"
        unique_id: ac_suite_master_modo
        icon: mdi:air-conditioner
        state: "{{ states('climate.c640155f') }}"
        availability: "{{ states('climate.c640155f') not in ['unavailable', 'unknown'] }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Kids Room Temperatura"
        unique_id: ac_kids_room_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('climate.c64015c4', 'current_temperature') }}"
        availability: "{{ state_attr('climate.c64015c4', 'current_temperature') is number }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "AC Kids Room Modo"
        unique_id: ac_kids_room_modo
        icon: mdi:air-conditioner
        state: "{{ states('climate.c64015c4') }}"
        availability: "{{ states('climate.c64015c4') not in ['unavailable', 'unknown'] }}"
        attributes:
