  # Tomada do office (Office UPS): amostras de 5 em 5 minutos. O sensor original atualiza a cada poucos
  # segundos e encheria o cartão SD; estes sensores é que ficam no histórico/recorder.
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: event
        event_type: ac_amostra
    sensor:
      - name: "Office Tomada Potência"
        unique_id: office_tomada_potencia
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.office_ups_potencia') }}"
        availability: "{{ is_number(states('sensor.office_ups_potencia')) }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "Office Tomada Tensão"
        unique_id: office_tomada_tensao
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ states('sensor.office_ups_tensao') }}"
        availability: "{{ is_number(states('sensor.office_ups_tensao')) }}"
        attributes:
          amostra: "{{ now().isoformat() }}"
      - name: "Office Tomada Corrente"
        unique_id: office_tomada_corrente
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: "{{ states('sensor.office_ups_corrente') }}"
        availability: "{{ is_number(states('sensor.office_ups_corrente')) }}"
        attributes:
          amostra: "{{ now().isoformat() }}"

# Energia do office calculada por integração da potência (kWh com 3 casas decimais).
# O contador da tomada (sensor.office_ups_energia_total) só tem resolução de 0,01 kWh, o que é
# demasiado grosseiro para consumos por hora.
sensor:
  - platform: integration
    source: sensor.office_ups_potencia
    name: Office Energia Calculada
    unique_id: office_energia_calculada
    unit_prefix: k
    unit_time: h
    round: 4
    method: trapezoidal
    max_sub_interval: "00:05:00"

# Consumo do office por hora, dia e mês (reiniciam no fim de cada período).
utility_meter:
  office_energia_hora:
    name: Office Energia Hora
    unique_id: office_energia_hora
    source: sensor.office_energia_calculada
    cycle: hourly
  office_energia_dia:
    name: Office Energia Dia
    unique_id: office_energia_dia
    source: sensor.office_energia_calculada
    cycle: daily
  office_energia_mes:
    name: Office Energia Mês
    unique_id: office_energia_mes
    source: sensor.office_energia_calculada
    cycle: monthly

recorder:
  purge_keep_days: 800
  commit_interval: 60
  include:
    entities:
      - sensor.ac_living_room_temperatura
      - sensor.ac_living_room_setpoint
      - sensor.ac_living_room_modo
      - sensor.ac_living_room_ventilador
      - sensor.ac_cozinha_temperatura
      - sensor.ac_cozinha_setpoint
      - sensor.ac_cozinha_modo
      - sensor.ac_cozinha_ventilador
      - sensor.ac_office_temperatura
      - sensor.ac_office_setpoint
      - sensor.ac_office_modo
      - sensor.ac_office_ventilador
      - sensor.ac_suite_master_temperatura
      - sensor.ac_suite_master_setpoint
      - sensor.ac_suite_master_modo
      - sensor.ac_suite_master_ventilador
      - sensor.ac_kids_room_temperatura
      - sensor.ac_kids_room_setpoint
      - sensor.ac_kids_room_modo
      - sensor.ac_kids_room_ventilador
      - sensor.temperatura_exterior
      - sensor.office_tomada_potencia
      - sensor.office_tomada_tensao
      - sensor.office_tomada_corrente
      - sensor.office_ups_energia_total
      - sensor.office_energia_calculada
      - sensor.office_energia_hora
      - sensor.office_energia_dia
      - sensor.office_energia_mes
      - switch.office_ups_tomada_1
